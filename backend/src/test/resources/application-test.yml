spring:
  application:
    name: procurezone-backend-test
  datasource:
    url: jdbc:h2:mem:procurezone-test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: always

jwt:
  issuer: procurezone-backend-test
  secret: 0123456789ABCDEF0123456789ABCDEF
  access-token:
    expiration: PT30M
