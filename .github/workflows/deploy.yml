name: Build and Deploy ProcureZone

on:
  push:
    branches: [ main, auth/employee-only-login ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend JAR
        run: mvn package -DskipTests -f backend/pom.xml

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Stop existing application
        run: |
          PID=$(pgrep -f "procurezone-backend" || true)
          if [ -n "$PID" ]; then
            kill -15 $PID
            sleep 10
            echo "Stopped PID: $PID"
          else
            echo "No running instance found"
          fi

      - name: Deploy JAR
        run: |
          cp backend/target/procurezone-backend-0.1.0-SNAPSHOT.jar \
             /opt/procurezone/backend/procurezone-backend-0.1.0-SNAPSHOT.jar

      - name: Deploy frontend
        run: |
          cp -r frontend/dist/* /opt/procurezone/frontend/

      - name: Start application
        run: |
          nohup java -jar /opt/procurezone/backend/procurezone-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=prod \
            >> /opt/procurezone/logs/app.log 2>&1 &
          echo "Started PID: $!"
          sleep 20

      - name: Reload Nginx
        run: sudo systemctl reload nginx

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
          echo "Health check: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Health check failed"
            exit 1
          fi
