name: Build and Deploy ProcureZone

on:
  push:
    branches: [ main, auth/employee-only-login ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend JAR
        run: mvn package -DskipTests -f backend/pom.xml

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy JAR
        run: |
          cp backend/target/procurezone-backend-0.1.0-SNAPSHOT.jar \
             /opt/procurezone/backend/procurezone-backend-0.1.0-SNAPSHOT.jar

      - name: Deploy frontend
        run: |
          cp -r frontend/dist/* /opt/procurezone/frontend/

      - name: Restart application
        run: sudo systemctl restart procurezone

      - name: Reload Nginx
        run: sudo systemctl reload nginx

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Application is up!"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Application did not start within 2 minutes"
          tail -50 /opt/procurezone/logs/app.log
          exit 1
