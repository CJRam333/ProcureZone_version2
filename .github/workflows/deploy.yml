name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: mvn package -DskipTests -f backend/pom.xml

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/target/procurezone-backend-0.1.0-SNAPSHOT.jar"
          target: "/opt/procurezone/backend/"
          strip_components: 2

      - name: Deploy frontend dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/opt/procurezone/frontend/"
          strip_components: 2

      - name: Restart application on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop existing JAR process
            PID=$(pgrep -f "procurezone-backend" || true)
            if [ -n "$PID" ]; then
              kill -15 $PID
              sleep 10
            fi

            # Start new JAR
            nohup java -jar /opt/procurezone/backend/procurezone-backend-0.1.0-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              >> /opt/procurezone/logs/app.log 2>&1 &

            echo "Started PID: $!"

            # Wait for startup
            sleep 20

            # Reload Nginx
            sudo systemctl reload nginx

            # Health check
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            echo "Health check status: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "WARNING: Health check did not return 200"
              exit 1
            fi
