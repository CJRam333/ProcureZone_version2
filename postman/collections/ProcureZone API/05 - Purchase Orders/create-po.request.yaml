$kind: http-request
name: Create Purchase Order
method: POST
url: '{{baseUrl}}/api/v1/pos'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "indentId": 1,
      "vendorId": 1,
      "poDate": "2025-01-20",
      "expectedDeliveryDate": "2025-02-20",
      "deliveryAddress": "Warehouse A, Mumbai",
      "paymentTerms": "NET30",
      "remarks": "Urgent order",
      "items": [
        {
          "materialId": 1,
          "quantity": 100,
          "unitOfMeasureId": 1,
          "unitPrice": 250.00,
          "taxPercent": 18.0
        }
      ]
    }
