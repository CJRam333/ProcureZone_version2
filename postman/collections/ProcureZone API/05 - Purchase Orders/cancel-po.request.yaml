$kind: http-request
name: Cancel Purchase Order
method: POST
url: '{{baseUrl}}/api/v1/pos/{{poId}}/cancel'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "Cancelled due to vendor non-availability"
    }
