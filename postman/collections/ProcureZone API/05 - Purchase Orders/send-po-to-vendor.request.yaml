$kind: http-request
name: Send PO To Vendor
method: POST
url: '{{baseUrl}}/api/v1/pos/{{poId}}/send-to-vendor'
order: 9000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "PO sent to vendor via email"
    }
