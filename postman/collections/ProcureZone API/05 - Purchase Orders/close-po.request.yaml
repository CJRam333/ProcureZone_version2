$kind: http-request
name: Close Purchase Order
method: POST
url: '{{baseUrl}}/api/v1/pos/{{poId}}/close'
order: 12000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "PO closed after full delivery"
    }
