$kind: http-request
name: Submit Purchase Order
method: POST
url: '{{baseUrl}}/api/v1/pos/{{poId}}/submit'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "Submitting PO for approval"
    }
