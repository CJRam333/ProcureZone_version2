$kind: http-request
name: Submit Indent
method: POST
url: '{{baseUrl}}/api/v1/indents/{{indentId}}/submit'
order: 9000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "Submitting for approval"
    }
