$kind: http-request
name: Cancel Indent
method: POST
url: '{{baseUrl}}/api/v1/indents/{{indentId}}/cancel'
order: 12000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "Cancelled as no longer required"
    }
