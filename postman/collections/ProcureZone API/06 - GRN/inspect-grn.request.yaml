$kind: http-request
name: Inspect GRN
method: POST
url: '{{baseUrl}}/api/v1/grn/{{grnId}}/inspect'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "remarks": "Inspection initiated for quality check"
    }
