      "address": "123 Industrial Area, Mumbai",
      "gstNumber": "27AABCU9603R1ZX",
      "panNumber": "AABCU9603R",
      "bankAccountNumber": "1234567890",
      "ifscCode": "HDFC0001234",
      "paymentTerms": "NET30",
      "active": true
    }
