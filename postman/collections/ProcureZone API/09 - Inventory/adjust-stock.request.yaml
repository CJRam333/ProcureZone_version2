$kind: http-request
name: Adjust Stock
method: POST
url: '{{baseUrl}}/api/v1/inventory/adjust'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "materialId": 1,
      "adjustmentType": "INCREASE",
      "quantity": 10,
      "unitOfMeasureId": 1,
      "reason": "Physical count adjustment",
      "remarks": "Stock adjusted after physical verification"
    }
